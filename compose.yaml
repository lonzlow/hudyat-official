
services:
  nginx: 
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-certs:/etc/nginx/certs:ro
    depends_on:
      - server
    networks:
      - web
    
  server:
    image: 143629080340.dkr.ecr.ap-southeast-2.amazonaws.com/hudyat:latest
    restart: always
    env_file: .env
    environment: 
      - NODE_OPTIONS=--max-old-space-size=384
    expose:
      - "3000"
    networks:
      - web
networks:
  web:
    driver: bridge

  


      


