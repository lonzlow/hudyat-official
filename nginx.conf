# How many worker processes NGINX spawns. Each worker is a single-threaded
# event loop that can juggle thousands of connections. 1 is fine for local
# testing; on a real server you'd usually set this to the number of CPU cores.
worker_processes 1;

events {
    # Max simultaneous connections PER worker. Total capacity = worker_processes * worker_connections.
    worker_connections 1024;
}

http {
    # Loads the mime.types file so NGINX knows how to set Content-Type
    # headers (e.g. .html -> text/html, .css -> text/css) based on file extension.
    include mime.types;

    # Defines a named pool of backend servers NGINX can load-balance across.
    # "nodejs_cluster" is just a label you reference later with proxy_pass.
    upstream nodejs_cluster {
        # Load balancing algorithm: send each new request to whichever
        # backend currently has the fewest active connections.
        # (Default with no algorithm specified is round robin.)
        least_conn;

        # The actual backend instances — e.g. 3 copies of the same Node.js
        # app running on different ports, probably via pm2 or separate processes.
        server server:3000; # "server" matches the service name in compose.yaml
    }

    # A server block = one virtual host / site config.
    server {
        # Port NGINX listens on for incoming requests.
        listen 443 ssl;
	
        # Which Host header this block responds to. "localhost" = only
        # matches requests where the Host header is literally "localhost".
        server_name localhost;

	    ssl_certificate /etc/nginx/certs/nginx-selfsigned.cert;
	    ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Matches ALL request paths ("/" catches everything not matched
        # by a more specific location block).
        location / {
            # Forward the request to the upstream pool defined above.
            # NGINX picks a backend server using the least_conn algorithm.
            proxy_pass http://nodejs_cluster;

            # By default, proxied requests lose the original Host header
            # (NGINX replaces it with the backend's address). This restores
            # the original Host so your Node app sees the real domain.
            proxy_set_header Host $host;

            # Same idea — without this, your backend would see NGINX's IP
            # (127.0.0.1) as the client, not the real visitor's IP.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme; 
        }
    }
}
